[project]
name = "stylefix"
version = "0.1.2"
description = "Regularize a Markdown file to US or UK English and a style guide, using Vale plus a local LLM for the ambiguous cases."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
stylefix = "stylefix.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["stylefix"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
