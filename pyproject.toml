[project]
name = "stylefix"
version = "0.8.0"
description = "Regularize a Markdown file to US or UK English and a style guide, using Vale plus a language model for the ambiguous cases."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT AND LicenseRef-VarCon"
license-files = ["LICENSE", "stylefix/dict/README-varcon.txt"]
authors = [{ name = "Andrew Brož" }]
dependencies = ["spylls>=0.1.7", "adjudicate>=0.3.1,<0.4"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Text Processing :: Markup :: Markdown",
]

[project.urls]
Homepage = "https://github.com/AndrewBroz/stylefix"
Issues = "https://github.com/AndrewBroz/stylefix/issues"

[project.scripts]
stylefix = "stylefix.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Only what an sdist needs, so nothing ignored elsewhere (.superpowers/ via a
# global gitignore, docs/superpowers/) can leak in.
[tool.hatch.build.targets.sdist]
only-include = ["stylefix", "tests", "man", "examples", "scripts", "LICENSE", "README.md",
                "pyproject.toml"]
exclude = ["__pycache__", "*.pyc"]

[tool.hatch.build.targets.wheel]
packages = ["stylefix"]
include = ["stylefix/**/*.txt", "stylefix/**/*.yml", "stylefix/dict/*"]

[tool.uv.sources]
adjudicate = { path = "../adjudicate", editable = true }

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
