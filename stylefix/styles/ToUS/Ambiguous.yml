# Generated by `python -m stylefix.wordlist`. Words whose US form depends on sense; flag only, the adjudicator chooses.
extends: existence
message: "'%s' has more than one US spelling; needs adjudication."
level: suggestion
ignorecase: true
tokens:
  - '\b(psychoanalyses|electrolyses|prefoliation|digitalises|draughtsman|draughtsmen|nanogrammes|areometric|hydrolyses|prelection|reanalyses|apprising|catalyses|coelomata|foregoing|paralyses|typhoemia|analyses|apprised|apprises|caulking|dialogue|dialyses|draughts|foregoes|foregone|forewent|whiskies|apprise|blondes|bussing|calking|castors|caulked|draught|faggots|sheikhs|whiskys|blonde|bussed|busses|calked|castor|caulks|dialog|diploe|faggot|forego|gaging|hooray|hurrah|hurray|jibing|sheikh|sheiks|tonnes|whisky|aeric|calks|caulk|dikes|discs|disks|dykes|gaged|gages|hippy|jibed|jibes|poufs|sheik|spelt|tonne|wolfs|zoeas|aery|calk|dike|disc|disk|dyke|gage|jibe|mums|pouf|zoea|mat|mum|wiz)\b'
