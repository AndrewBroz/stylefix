# Generated by `python -m stylefix.wordlist`. Pattern family detector;
# stylefix/patterns.py decides what to do with each hit.
extends: existence
message: "'%s' may need the UK spelling of its ending."
level: suggestion
ignorecase: false
tokens:
  - '\b[A-Za-z]{2,}[bcdfghklmnpstvz](?:ers|ered|ering|er)\b'
